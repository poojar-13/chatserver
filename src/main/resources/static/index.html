<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Chat Application</title>
    <link rel="stylesheet" href="style.css" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/emoji-mart@5.5.2/css/emoji-mart.css" />
	<script src="https://cdn.jsdelivr.net/npm/emoji-mart@5.5.2/dist/browser.js"></script>
	
</head>
<body>
	<div class="app-container">


	<div class="users-panel">

	    <div class="sidebar-header">
	        <div class="hamburger" id="hamburger">☰</div>
	        <h3>Chats</h3>
	    </div>

	    <div class="new-chat-wrapper">
	        <button id="newChatBtn" class="new-chat-btn">
	            + New Chat
	        </button>
	    </div>

	    <ul id="onlineList"></ul>

	</div>

	<!-- CHAT PANEL -->
	<div class="chat-container">

		<div class="chat-header">

		  <div class="chat-user-info">
		    <div class="chat-avatar-wrapper">
		      <div class="chat-avatar" id="chatAvatar">?</div>
		      <span class="online-dot" id="chatOnlineDot"></span>
		    </div>

		    <div class="chat-user-text">
		      <div class="chat-username" id="chat-with">Select a user</div>
		      <div class="chat-status" id="chatStatus"></div>
			  <div class="connection-status" id="connectionStatus"></div>
		    </div>
		  </div>

		  <button id="blockUserBtn" class="block-user-btn" style="display:none;"></button>

		</div>

	    <div id="chat-box" class="chat-messages"></div>

		<div class="chat-input">
			<button id="emojiBtn" class="emoji-btn">
			    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#8a8fa3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			        <circle cx="12" cy="12" r="10"/>
			        <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
			        <line x1="9" y1="9" x2="9.01" y2="9"/>
			        <line x1="15" y1="9" x2="15.01" y2="9"/>
			    </svg>
			</button>
		    <div id="emojiPickerContainer" class="emoji-picker-container"></div>
		    <button id="attachBtn" class="attach-btn">📎</button>
		    <input type="file" id="fileInput" style="display:none" />
		    <input
		        type="text"
		        id="messageInput"
		        placeholder="Type a message..."
		        disabled
		    />
		    <button id="sendBtn">Send</button>
		</div>
		
	</div>
</div>


<div class="overlay" id="overlay"></div>
<div class="side-panel" id="sidePanel">
    <div class="panel-content">
        <div class="panel-avatar" id="panelAvatar">P</div>
        <div class="panel-username" id="panelUsername">Pooja</div>

        <div class="panel-item" id="openSettings">Settings</div>
        <div class="panel-item" id="changePassword">Change Password</div>
		<div class="panel-item" id="viewBlocked">Blocked Users</div>
        <div class="panel-item logout-item" id="logoutBtnPanel">Logout</div>
    </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal" id="settingsModal">
    <div class="modal-content">
        <h3>Update Username</h3>

        <label>Current Username</label>
        <input type="text" id="currentUsername" disabled>

        <label>New Username</label>
        <input type="text" id="newUsernameInput">

        <div class="modal-actions">
            <button id="saveUsernameBtn">Save</button>
            <button id="closeSettingsBtn" class="secondary-btn">Cancel</button>
        </div>

        <p class="modal-message" id="usernameMessage"></p>
    </div>
</div>

<!-- CHANGE PASSWORD MODAL -->
<div class="modal" id="passwordModal">
    <div class="modal-content">
        <h3>Change Password</h3>

        <label>Old Password</label>
        <input type="password" id="oldPasswordInput">

        <label>New Password</label>
        <input type="password" id="newPasswordInput">

        <label>Confirm New Password</label>
        <input type="password" id="confirmPasswordInput">

        <div class="modal-actions">
            <button id="savePasswordBtn">Change</button>
            <button id="closePasswordBtn" class="secondary-btn">Cancel</button>
        </div>

        <p class="modal-message" id="passwordMessage"></p>
    </div>
</div>

<!-- BLOCKED USERS MODAL -->
<div class="modal" id="blockedModal">
    <div class="modal-content">
        <h3>Blocked Users</h3>

        <ul id="blockedList" style="list-style:none; padding:0;"></ul>

        <div class="modal-actions">
			<button id="closeBlockedBtn" class="close-blocked-btn">Close</button>
        </div>
    </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="modal" id="deleteModal">
    <div class="modal-content">
        <h3>Delete Message</h3>

        <p style="font-size: 14px; opacity: 0.7;">
            Are you sure you want to delete this message?
        </p>

        <div class="modal-actions">
            <button id="confirmDeleteBtn" class="primary-btn">
                Delete
            </button>

            <button id="cancelDeleteBtn" class="cancel-btn">
                Cancel
            </button>
        </div>
    </div>
</div>

<!-- NEW CHAT MODAL -->
<div id="newChatModal" class="modal">
  <div class="modal-content">
    <h3>Start New Chat</h3>

    <input 
      type="text" 
      id="newChatSearch" 
      placeholder="Search users..." 
      autocomplete="off"
    />

    <ul id="newChatUserList" class="user-search-list"></ul>

    <button id="closeNewChatBtn">Close</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
