<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
	<p id="sessionMessage" style="color:red; text-align:center;"></p>

	<div class="auth-card">
	    <h2>Login</h2>

	    <input type="email" id="email" placeholder="Enter email">
	    <input type="password" id="password" placeholder="Enter password">
		<div class="auth-links">
		    <a href="#" onclick="openForgotModal()">Forgot Password?</a>
		</div>


	    <button onclick="login()">Login</button>

	    <p id="error" class="error"></p>

	    <div class="auth-footer">
	        Don't have an account?
	        <a href="signup.html">Sign Up</a>
	    </div>
	</div>

	<script>
	function login() {

	    const email = document.getElementById("email").value.trim();
	    const password = document.getElementById("password").value.trim();

	    if (!email || !password) {
	        document.getElementById("error").textContent =
	            "Email and password required";
	        return;
	    }

	    fetch("/api/auth/login", {
	        method: "POST",
	        headers: {
	            "Content-Type": "application/json"
	        },
	        body: JSON.stringify({
	            email: email,
	            password: password
	        })
	    })
	    .then(res => res.json())
	    .then(data => {

	        if (data.token) {
	            localStorage.setItem("jwt", data.token);
	            localStorage.setItem("username", data.username);
	            window.location.href = "index.html";
	        } else {
	            document.getElementById("error").textContent =
	                data.error || "Login failed";
	        }
	    })
	    .catch(() => {
	        document.getElementById("error").textContent =
	            "Server error";
	    });
	}
	
	function openForgotModal() {
	    document.getElementById("forgotModal").classList.add("show");
	}

	function closeForgotModal() {
	    document.getElementById("forgotModal").classList.remove("show");
	}

	function sendReset() {

	    const email = document.getElementById("forgotEmail").value.trim();

	    if (!email) {
	        document.getElementById("forgotError").textContent =
	            "Email is required";
	        return;
	    }

	    fetch("/api/auth/forgot-password", {
	        method: "POST",
	        headers: {
	            "Content-Type": "application/json"
	        },
	        body: JSON.stringify({ email: email })
	    })
	    .then(res => res.text())
	    .then(data => {
	        document.getElementById("forgotError").textContent =
	            "If the email exists, a reset link has been sent.";
	    })
	    .catch(() => {
	        document.getElementById("forgotError").textContent =
	            "Server error.";
	    });
	}
	
	document.addEventListener("DOMContentLoaded", () => {

		const msg = sessionStorage.getItem("sessionExpired");
	    if (msg) {
	        document.getElementById("sessionMessage").textContent =
	            "Session expired. Please login again.";
				sessionStorage.removeItem("sessionExpired");
	    }
	});

	</script>
	<div class="modal" id="forgotModal">
	    <div class="modal-content">
	        <h3>Reset Password</h3>

	        <input type="email" id="forgotEmail" placeholder="Enter your email">

			<p id="forgotError" class="error"></p>

			<div class="modal-actions">
			    <button class="cancel-btn" onclick="closeForgotModal()">Cancel</button>
			    <button class="primary-btn" onclick="sendReset()">Send Reset Link</button>
			</div>

	    </div>
	</div>


</body>
</html>
