<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">
    <h2>Reset Password</h2>

    <input type="password" id="newPassword" placeholder="New password">
    <input type="password" id="confirmPassword" placeholder="Confirm password">

    <button onclick="resetPassword()">Update Password</button>

    <p id="error" class="error"></p>
</div>

<script>
function getTokenFromURL() {
    const params = new URLSearchParams(window.location.search);
    return params.get("token");
}

function resetPassword() {
    const token = getTokenFromURL();
    const newPassword = document.getElementById("newPassword").value.trim();
    const confirmPassword = document.getElementById("confirmPassword").value.trim();

    if (!token) {
        document.getElementById("error").textContent = "Invalid or missing reset token.";
        return;
    }

    if (!newPassword || !confirmPassword) {
        document.getElementById("error").textContent = "All fields are required.";
        return;
    }

    if (newPassword !== confirmPassword) {
        document.getElementById("error").textContent = "Passwords do not match.";
        return;
    }

    fetch("/api/auth/reset-password", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            token: token,
            newPassword: newPassword
        })
    })
    .then(res => res.text())
    .then(data => {
        if (data === "Password reset successfully") {
            alert("Password updated successfully!");
            window.location.href = "login.html";
        } else {
            document.getElementById("error").textContent = data;
        }
    })
    .catch(() => {
        document.getElementById("error").textContent = "Server error.";
    });
}
</script>

</body>
</html>
